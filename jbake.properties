# JBake Konfiguration fuer die Datenbanken-Vorlesung

# Verzeichnisse
asset.folder=assets
# Gemergtes Quellverzeichnis: MetaMerge (Build-Tool) fuellt hier die
# meta.properties je Ordner in das Frontmatter jeder .md ein.
content.folder=target/staged-content
template.folder=templates

# Template-Engine
template.engine=freemarker

# Template-Dateien
template.page.file=page.ftl
template.masterindex.file=index.ftl
template.search.file=search.ftl

# Rendering (kein auto-generiertes Blog-Index, da wir eine eigene index.md haben)
render.index=false
render.archive=false
render.feed=false
render.tags=false
render.sitemap=false

# Ausgabe
output.extension=.html

# Datumsformat
date.format=yyyy-MM-dd

# Seiteninhalt
default.status=published
default.type=page

# Site-Host
site.host=https://git.it.hs-heilbronn.de/dpublic/lecture-gen

# Datenbank
db.store=memory

# Markdown-Erweiterungen
markdown.extensions=HARDWRAPS,AUTOLINKS,FENCED_CODE_BLOCKS,TABLES,STRIKETHROUGH,EXTANCHORLINKS
