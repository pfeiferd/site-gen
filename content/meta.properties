# Site-wide metadata common to ALL lectures.
# Merged into every page by MetaMerge -> available in templates as content.<key>.
# A *Url that is empty makes the corresponding name/logo render as plain text
# (no hyperlink).

# Lecturer
lecturerName=Prof. Dr. Daniel Pfeifer
lecturerUrl=https://www.hs-heilbronn.de/de/??
# English lecturer page (leave empty if none -> link stays German / omitted)
lecturerUrlEn=https://www.hs-heilbronn.de/de/??

# University (logo top-left links here)
universityName=Hochschule Heilbronn
universityNameEn=Heilbronn University
universityUrl=https://www.hs-heilbronn.de
universityUrlEn=https://www.hs-heilbronn.de/en
universityLogo=hhn-logo.png
universityLogoEn=hhn-logo-en.png

# Faculty (faculty name links here)
facultyName=Fakultät|Informatik
facultyNameEn=Faculty of|Computer Science
facultyUrl=https://www.hs-heilbronn.de/de/fakultaet-it
facultyUrlEn=https://www.hs-heilbronn.de/en/faculty-it

# Bedienelemente der Kopfzeile ein-/ausschalten (Vorgabe jeweils true).
# Hier site-weit; in content/<lecture>/meta.properties wirken sie nur fuer
# diese Vorlesung.
#   showViewSwitch    Umschalter Dokument/Slides (rechts oben)
#   showFullscreen    Vollbildknopf (rechts oben)
#   showHeaderToggle  Pfeil zum Ein-/Ausklappen der Kopfzeile (links oben)
#showViewSwitch=false
#showFullscreen=false
#showHeaderToggle=false

# Titel der Registerkarte (nach Seiten- und Vorlesungsname). Ohne Angabe stuende
# hier der Name des Traegers (universityName).
siteTitle=Vorlesungen HS Heilbronn

# Kachelserver der Karten (siehe Vorlesungsseite "Karten"). Ohne Angabe nimmt
# lecture-gen tile.openstreetmap.org; hier der Server des deutschen OSM-Vereins.
# Die Quellenangabe ist bei OpenStreetMap-Karten Pflicht.
mapTiles=https://tile.openstreetmap.de/{z}/{x}/{y}.png
mapAttribution=&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende

# Die Vorlesung liegt direkt unter content/ (de/, en/, common/ ohne
# Zwischenebene) - deshalb stehen ihre Angaben hier site-weit.
navgroup=docs
lecture=tutorial
lectureIcon=feather.svg
